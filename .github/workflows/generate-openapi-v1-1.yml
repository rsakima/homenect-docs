name: Generate OpenAPI v1.1

on:
  push:
    branches: [main]
    paths:
      - '07_system/openapi/HOMENECT_OpenAPI_v1.0.yaml'
      - '07_system/openapi/HOMENECT_OpenAPI_Overrides_v1.1.yaml'
      - 'scripts/build_openapi_v1_1.py'
      - '.github/workflows/generate-openapi-v1-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate consolidated contract
        run: python scripts/build_openapi_v1_1.py
      - name: Verify expected v1.1 decisions
        run: |
          grep -q 'version: 1.1.0' 07_system/openapi/HOMENECT_OpenAPI_v1.1.yaml
          grep -q 'partner_compensation:' 07_system/openapi/HOMENECT_OpenAPI_v1.1.yaml
          grep -q 'REQUESTED / MATCHINGではnull可' 07_system/openapi/HOMENECT_OpenAPI_v1.1.yaml
      - name: Commit generated file when changed
        run: |
          if git diff --quiet -- 07_system/openapi/HOMENECT_OpenAPI_v1.1.yaml && git ls-files --error-unmatch 07_system/openapi/HOMENECT_OpenAPI_v1.1.yaml >/dev/null 2>&1; then
            echo 'No OpenAPI change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 07_system/openapi/HOMENECT_OpenAPI_v1.1.yaml
          git commit -m 'docs: generate consolidated OpenAPI v1.1'
          git push
